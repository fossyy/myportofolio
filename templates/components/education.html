<section class="portfolio-section" id="education">
    <div class="section-heading">
        <span class="section-number">04</span>
        <h2 class="section-title">education</h2>
    </div>
    <div class="section-content">
        <div class="record-list">
            {% for education in education_list %}
                <article class="record">
                    <div class="record__meta">{{ education.period }}</div>
                    <div class="record__body">
                        <h3 class="record__title">{{ education.qualification }}</h3>
                        <p class="record__organization">{{ education.institution }}</p>
                    </div>
                </article>
            {% empty %}
                <p class="record__description">No education has been added yet.</p>
            {% endfor %}
        </div>
    </div>
</section>
