<section class="portfolio-section skills-section" id="skills">
    <div class="section-watermark" aria-hidden="true">stack</div>
    <div class="section-heading">
        <span class="section-number">01</span>
        <h2 class="section-title">technical skills</h2>
    </div>
    <div class="section-content">
        <div class="skills-groups">
            {% regroup skill_list by category as skill_groups %}
            {% for group in skill_groups %}
                <div class="skills-group">
                    <h3 class="skills-group__title">{{ group.grouper }}</h3>
                    <div class="tag-list">
                        {% for skill in group.list %}
                            <span class="tech-tag">{{ skill.name }}</span>
                        {% endfor %}
                    </div>
                </div>
            {% empty %}
                <p class="record__description">No skills have been added yet.</p>
            {% endfor %}
        </div>
    </div>
</section>
