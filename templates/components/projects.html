{% load static %}
<section class="portfolio-section" id="projects"
         data-projects-endpoint="{% url 'projects:api_list' %}"
         data-create-endpoint="{% url 'projects:create_ajax' %}"
         data-is-owner="{{ is_portfolio_owner|yesno:'true,false' }}"
         data-can-edit="{{ can_edit_content|yesno:'true,false' }}"
         data-delete-template="{% url 'projects:delete' 0 %}"
         data-edit-template="{% url 'projects:update' 0 %}"
         data-star-template="{% url 'projects:toggle_star' 0 %}">
    <div class="section-heading">
        <span class="section-number">03</span>
        <h2 class="section-title">selected projects</h2>

        {% if is_portfolio_owner %}
            <button type="button" class="project-link project-link--source project-add-button"
                    popovertarget="add-project-modal">[ + add_project ]</button>
        {% endif %}
    </div>

    <div class="section-content">
        <form id="project-search-form" class="project-search" role="search">
            <label class="visually-hidden" for="project-search-input">Search projects</label>
            <input type="search" id="project-search-input" name="title"
                   placeholder="Search by project name" class="project-search__input"
                   aria-label="Search by project name">
            <button type="submit" class="project-link">[ search ]</button>
        </form>
        <div id="projects-loading" class="project-row__description hide" role="status">Loading projects...</div>
        <div id="projects-error" class="project-row__description hide" role="alert">Failed to load project data. Please try again.</div>
        <div id="projects-empty" class="project-row__description hide">No projects have been added or found yet.</div>
        <div id="projects-grid" class="project-list hide"></div>
    </div>
</section>

{% if is_portfolio_owner %}
    {% include "components/project_form_modal.html" %}
{% endif %}

<script src="{% static 'js/projects.js' %}" defer></script>
