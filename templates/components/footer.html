<footer class="portfolio-footer">
    <div class="portfolio-footer__identity">
        <span class="portfolio-footer__brand">
            {{ profile.short_name }}
            <span class="portfolio-footer__brand-cursor" aria-hidden="true"></span>
        </span>
        <span class="portfolio-footer__description">{{ profile.name }} | {{ profile.role|capfirst }} &amp; {{ profile.study_program|capfirst }}</span>
    </div>
    <div class="portfolio-footer__links">
        <a href="https://github.com/fossyy" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://www.linkedin.com/in/bagas-aulia-rezki/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="https://fossy.my.id/" target="_blank" rel="noopener noreferrer">Website</a>
        <a href="{% url 'main:show_main' %}#home">Back to top</a>
    </div>
    <span class="portfolio-footer__copyright">© {{ profile.name }}</span>
</footer>
