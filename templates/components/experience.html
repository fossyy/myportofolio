{% load static %}
<section class="portfolio-section" id="experience"
         data-list-endpoint="{% url 'api:experience_list' %}"
         data-login-url="{% url 'main:login' %}"
         data-is-owner="{{ is_portfolio_owner|yesno:'true,false' }}"
         data-is-authenticated="{{ user.is_authenticated|yesno:'true,false' }}"
         data-can-edit="{{ can_edit_content|yesno:'true,false' }}"
         data-detail-template="{% url 'api:experience_detail' '00000000-0000-0000-0000-000000000000' %}"
         data-star-template="{% url 'api:experience_star' '00000000-0000-0000-0000-000000000000' %}"
         data-csrf-token="{{ csrf_token }}">
    <div class="section-heading">
        <span class="section-number">02</span>
        <h2 class="section-title">experience</h2>
        {% if is_portfolio_owner %}
            <button type="button" class="project-link project-link--source project-add-button">[ + add_experience ]</button>
        {% endif %}
    </div>

    <div class="section-content">
        <form id="experience-search-form" class="project-search" role="search">
            <label class="visually-hidden" for="experience-search-input">Search experience</label>
            <input type="search" id="experience-search-input" name="title"
                   placeholder="Search by role or title" class="project-search__input"
                   aria-label="Search by experience title">
            <button type="submit" class="project-link">[ search ]</button>
        </form>
        <p id="experience-loading" class="record__description" role="status">Loading experience...</p>
        <div id="experience-error" class="record__description hide" role="alert">
            Could not load experience. <button type="button" id="experience-retry" class="project-link">[ retry ]</button>
        </div>
        <p id="experience-empty" class="record__description hide">No experience has been added or found.</p>
        <div id="experience-grid" class="record-list hide"></div>
    </div>
</section>

{% if can_edit_content %}
    {% include "components/experience_form_modal.html" %}
{% endif %}
<script src="{% static 'js/experience.js' %}" defer></script>
