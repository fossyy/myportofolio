<div id="add-experience-modal" class="project-form-modal" popover="auto"
     role="dialog" aria-modal="true" aria-labelledby="add-experience-modal-title">
    <button type="button" class="project-form-modal__backdrop"
            popovertarget="add-experience-modal" popovertargetaction="hide"
            aria-label="Close add experience form"></button>
    <div class="project-form-modal__content">
        <button type="button" class="project-form-modal__close"
                popovertarget="add-experience-modal" popovertargetaction="hide"
                aria-label="Close add experience form">×</button>
        <h2 id="add-experience-modal-title">Add Experience</h2>
        <form id="experience-form" method="post"
              action="{% url 'experiences:create_ajax' %}" class="project-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="project-form__field">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}<p class="project-form__error">{{ error }}</p>{% endfor %}
                </div>
            {% endfor %}
            <div class="project-form__actions">
                <button type="button" class="terminal-action" popovertarget="add-experience-modal" popovertargetaction="hide">Cancel</button>
                <button type="submit" class="terminal-action">Add Experience</button>
            </div>
        </form>
    </div>
</div>
